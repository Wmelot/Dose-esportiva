/* ══════════════════════ TELA · PAINEL DA TURMA ══════════════════════

   e mostra a tabela e, mais importante, a conta dos dois erros opostos da turma inteira.

   por isso toda leitura e escrita vai dentro de try/catch. */
const CHAVE_PAINEL = "dose.painel.v1";
function lerPainel(){
  try { const s = localStorage.getItem(CHAVE_PAINEL); return s ? JSON.parse(s) : []; }
  catch(e){ return []; }
}
function gravarPainel(lista){
  try { localStorage.setItem(CHAVE_PAINEL, JSON.stringify(lista)); } catch(e){}
}
function telaPainel(app){

  topo.appendChild(tt);
  const bv = el("button","pri","Voltar");
  bv.onclick = ()=>{ VENDO_PAINEL=false; render(); };
  topo.appendChild(bv);
  w.appendChild(topo);

  const guardados = lerPainel();
  const partidas = guardados.map(lerCodigo).filter(Boolean);

  const entrada = el("div","card stack");
  entrada.appendChild(el("div","lbl","Colar código — um por linha"));
  const ta = document.createElement("textarea");
  ta.rows = 3; ta.placeholder = "DOSE1|Grupo A|Grupo B|...";
  ta.style.cssText = "width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);"
    + "border-radius:4px;padding:9px 11px;font-family:var(--num);font-size:12px;resize:vertical";
  entrada.appendChild(ta);
  const msg = el("div","faint");
  const lr = el("div","row");
  const ba = el("button","pri","Adicionar");
  ba.onclick = ()=>{
    const linhas = ta.value.split("\n").map(s=>s.trim()).filter(Boolean);
    let bons = 0, ruins = 0;
    const atual = lerPainel();
    for(const l of linhas){
      if(lerCodigo(l)){ if(!atual.includes(l)){ atual.push(l); bons++; } } else ruins++;
    }
    gravarPainel(atual);
    if(ruins) msg.textContent = ruins + " linha(s) não eram código válido e foram ignoradas.";
    ta.value = "";
    render();
  };
  lr.appendChild(ba);
  if(partidas.length){
    const bl = el("button","danger","Limpar o painel");
    bl.onclick = ()=>{ if(confirm("Apagar as "+partidas.length+" partidas do painel?")){ gravarPainel([]); render(); } };
    lr.appendChild(bl);
  }
  entrada.appendChild(lr);
  entrada.appendChild(msg);
  w.appendChild(entrada);

  if(!partidas.length){
    const v = el("div","aviso");
    v.textContent = "Nenhuma partida ainda. Cada mesa gera o código no fim, na tela de relatório, "
      + "no botão Copiar resultado.";
    w.appendChild(v);
    app.appendChild(w);
    return;
  }

  /* ── tabela por GRUPO, anônima por padrão ──────────────────────────────
     A regra: cada grupo reconhece a própria linha, e ninguém reconhece a dos outros.
     Ordenada por erro de carga, a tabela vira um gradiente — e o gradiente é a aula,
     porque mostra o peso da decisão descendo até o resultado sem acusar ninguém. */
  const linhas = linhasDoPainel(partidas);
  const ct = el("div","card stack");
  ct.style.borderColor = "var(--cyan)";
  const ch = el("div","row"); ch.style.justifyContent="space-between";
  const ch1 = el("div");
  ch1.appendChild(el("h2","","O peso das decisões"));
  ch1.appendChild(el("p","dim","Uma linha por grupo, da menor para a maior quantidade de erro de carga."));
  ch.appendChild(ch1);
  const bn = el("button", PAINEL_NOMES ? "danger" : "ghost",
    PAINEL_NOMES ? "Ocultar os nomes" : "Mostrar os nomes");
  bn.title = PAINEL_NOMES ? "Volte a ocultar antes de projetar" : "Só para o seu uso, fora da projeção";
  bn.onclick = ()=>{ PAINEL_NOMES = !PAINEL_NOMES; render(); };
  ch.appendChild(bn);
  ct.appendChild(ch);

  const tw = el("div","tw"); const tb = el("table");
  const cab = el("tr");
  for(const h of [PAINEL_NOMES?"Grupo":"", "Erro de carga", "→ Lesões", "→ Atletas perdidas", "→ Jogos ganhos"])
    cab.appendChild(el("th","",h));
  tb.appendChild(cab);
  for(const g of linhas){
    const tr = el("tr");
    const td0 = el("td");
    if(PAINEL_NOMES) td0.textContent = g.nome;
    else {
      const barra = el("span","", "▌".repeat(Math.max(1, Math.min(6, g.erros || 1))));
      barra.style.color = g.erros ? "var(--ambar)" : "var(--verde)";
      barra.style.fontFamily = "var(--num)";
      td0.appendChild(barra);
    }
    tr.appendChild(td0);

    const te = el("td");
    if(!g.erros){ te.textContent = "nenhum"; te.style.color = "var(--verde)"; }
    else {
      const partes = [];
      if(g.exc) partes.push(g.exc + " por EXCESSO");
      if(g.fal) partes.push(g.fal + " por FALTA");
      te.textContent = partes.join(" · ");
      te.style.color = "var(--ambar)";
    }
    tr.appendChild(te);

    const tl = el("td","", String(g.les));
    if(g.les >= 4) tl.style.color = "var(--vermelho)";
    tr.appendChild(tl);
    const tf = el("td","", String(g.fora));
    if(g.fora) tf.style.color = "var(--vermelho)";
    tr.appendChild(tf);
    const tv = el("td","", g.vit + (g.vit===1?" jogo":" jogos"));
    tv.style.color = g.vit>=2 ? "var(--cyan)" : g.vit===0 ? "var(--faint)" : "var(--fg)";
    tr.appendChild(tv);
    tb.appendChild(tr);
  }
  tw.appendChild(tb);
  ct.appendChild(tw);
  const nn = el("p","faint");
  nn.textContent = PAINEL_NOMES
    ? "Os nomes estão à mostra. Oculte antes de projetar."
    : "Sem nomes de propósito: cada grupo reconhece a própria linha, e ninguém reconhece a dos outros. "
      + "O que está em julgamento é a decisão, não o grupo.";
  ct.appendChild(nn);
  w.appendChild(ct);

  /* ── a conta da turma ────────────────────────────────────────────────── */
  let exc=0, fal=0, les=0, fora=0, piorNome="—", piorR=0;
  for(const g of linhas){
    exc += g.exc; fal += g.fal; les += g.les; fora += g.fora;
    if(g.pior.r > piorR){ piorR = g.pior.r; piorNome = g.pior.nm; }
  }
  const grupos = linhas.length, total = grupos * ATLETAS.length;
  const cs = el("div","card stack");
  cs.appendChild(el("h2","","A turma inteira"));
  const g3 = el("div","grid3");
  const bloco = (v, rot, cor)=>{
    const d = el("div"); d.style.textAlign="center";
    const n = el("div","num"); n.style.fontSize="40px"; n.style.fontWeight="700";
    n.style.lineHeight="1"; n.style.color=cor||"var(--fg)"; n.textContent=String(v);
    d.appendChild(n); d.appendChild(el("div","lbl",rot)); return d;
  };
  g3.appendChild(bloco(total, grupos+" grupos · atletas administradas"));
  g3.appendChild(bloco(exc, "passaram de 1,45 — erro por EXCESSO", "var(--vermelho)"));
  g3.appendChild(bloco(fal, "caíram de 0,80 — erro por FALTA", "var(--ambar)"));
  g3.appendChild(bloco(les, "pontos de lesão somados", "var(--vermelho)"));
  cs.appendChild(g3);

  /* o elo entre erro e resultado, se os dados deixarem */
  if(grupos >= 4){
    const metade = Math.floor(grupos/2);
    const bons = linhas.slice(0, metade), ruins = linhas.slice(-metade);
    const vb = bons.reduce((s,g)=>s+g.vit,0), vr = ruins.reduce((s,g)=>s+g.vit,0);
    const lb = bons.reduce((s,g)=>s+g.les,0), lr = ruins.reduce((s,g)=>s+g.les,0);
    const el2 = el("div","conselho");
    el2.appendChild(el("div","lbl","no campeonato"));
    el2.appendChild(document.createTextNode(
      "Os "+metade+" grupos que dosaram melhor somaram "+vb+" vitória(s) e "+lb+" ponto(s) de lesão. "
      + "Os "+metade+" que dosaram pior somaram "+vr+" e "+lr+". "
      + (vb>vr ? "Dosar certo ganhou jogo nesta turma."
         : vb<vr ? "Nesta turma, quem dosou pior ganhou mais — vale perguntar à sala por que, e se dá para contar com isso de novo."
         : "Ficou empatado em vitórias, e aí a pergunta é qual elenco chegaria inteiro a um terceiro jogo.")));
    cs.appendChild(el2);
  }
  const leit = el("p","");
  leit.innerHTML = exc > fal
    ? "A turma errou mais <b>por excesso</b> ("+exc+" contra "+fal+"). Pergunta para abrir o debrief: "
      + "o que vocês estavam tentando ganhar quando subiram a carga?"
    : exc < fal
    ? "A turma errou mais <b>por falta</b> ("+fal+" contra "+exc+"). Pergunta para abrir o debrief: "
      + "quem vocês deixaram de treinar, e por que acharam que estavam protegendo essa atleta?"
    : "A turma errou igualmente <b>por excesso e por falta</b> ("+exc+" de cada). "
      + "É a curva em U inteira numa sala só.";
  cs.appendChild(leit);
  cs.appendChild(el("p","faint","Pior caso da turma: "+piorNome+" chegou a "+piorR.toFixed(2)+". "
    + "E uma lesão que não aconteceu não prova que a dose estava certa — olhem as zonas, não o desfecho."));
  w.appendChild(cs);
  app.appendChild(w);
}

    + "carga e a propriocepção decidem é a gravidade, não o evento — é o contínuo agudo × overuse da "
    + "aula 01. Todo o resto da lesão no jogo é saída do motor de carga e de capacidade × demanda.";
  ouro.appendChild(p);
  w.appendChild(ouro);
  app.appendChild(w);
}

function start(){ render(); }
start();
