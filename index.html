<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}</style>
</head>
<body>
<title>DOSE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* DOSE. Elenco idêntico dos dois lados, mercado de cartas virado para
   cima, recuperação que reduz carga aguda com piso em razão 1,00.
   Tema único escuro, deliberado — o jogo é projetado em sala e lido de longe.
   Informação aberta, exceto a escalação: o mercado virado já revela as mãos. */
:root{
  --bg:#0A1018; --panel:#111A24; --panel2:#17222E; --line:#24323F;
  --fg:#E8EEF4; --dim:#8FA3B4; --faint:#5C7083;
  --cyan:#3BC9DB; --verde:#2FB380; --ambar:#E0A030; --vermelho:#E05252; --roxo:#9B7BD4;
  --atq:#F0803C; --def:#4A9BE0; --rosa:#FF6FB5;
  --disp:"Barlow Condensed",Impact,sans-serif;
  --corpo:"Inter",system-ui,sans-serif;
  --num:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--corpo);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px;max-width:1180px;margin:0 auto}
h1,h2,h3,.disp{font-family:var(--disp);text-transform:uppercase;letter-spacing:.04em;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,8vw,58px);line-height:.92;font-weight:700}
h2{font-size:clamp(20px,3.4vw,27px);font-weight:600}
h3{font-size:16px;font-weight:600}
/* Isto precisa vir antes de qualquer regra que declare display.
   Regra de autor vence a regra do navegador, então um `display:` escrito aqui ANULA o
   atributo hidden do HTML. Foi exatamente o que aconteceu com #ficha, que tem
   display:flex: a camada escura da ficha ficava permanentemente por cima da tela,
   quase invisível, escurecendo tudo e engolindo todo clique. O jogo ficou inutilizável
   no navegador sem que nenhum teste percebesse, porque nenhum teste renderizava CSS. */
[hidden]{display:none!important}
.legenda{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-size:11.5px;
  color:var(--dim);border-left:2px solid var(--line);padding:7px 0 7px 11px;margin:2px 0}
.legenda .lbl{width:100%;margin-bottom:1px}
.legenda b{color:var(--fg);font-weight:600}
.legenda button{padding:1px 8px;font-size:11px}
.glos h3{color:var(--cyan)}
.glos p{font-size:13px;line-height:1.5}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.pse{color:var(--dim)}
.pse .psev{color:var(--cyan);font-weight:700}
.pse .pseq{color:var(--faint);font-weight:700;letter-spacing:.5px}
.pseBox{border-left:3px solid var(--cyan)}
.pseBox p{font-size:12.5px;line-height:1.45;margin:0}
.dim{color:var(--dim)}.faint{color:var(--faint)}
p{margin:0}
button{font-family:var(--corpo);font-size:14px;cursor:pointer;border-radius:4px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);padding:9px 16px;transition:border-color .12s,background .12s}
button:hover:not(:disabled){border-color:var(--cyan)}
button:disabled{opacity:.34;cursor:not-allowed}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.pri{background:var(--cyan);color:#071016;border-color:var(--cyan);font-weight:600}
.pri:hover:not(:disabled){background:#5FD8E8}
.danger{border-color:#5A2B2B;color:#F0A0A0}
.ghost{background:transparent}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0}
.lbl{font-family:var(--disp);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}

/* faixa de estado */
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);
  border-bottom:1px solid var(--line);padding-block:10px;margin-bottom:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--bg)}
#hud .row{justify-content:space-between;gap:14px}
.tl{display:flex;gap:3px;align-items:flex-end}
.tl i{display:block;width:26px;height:16px;border:1px solid var(--line);border-radius:2px;background:var(--panel);
  font-family:var(--disp);font-size:10px;line-height:14px;text-align:center;color:var(--faint);font-style:normal}
.tl i.jogo{background:var(--panel2);border-color:#3A4A5A;color:var(--dim)}
.tl i.feita{background:#1E3A32;border-color:var(--verde);color:var(--verde)}
.tl i.atual{background:var(--cyan);border-color:var(--cyan);color:#071016;font-weight:700}
.pill{font-family:var(--num);font-size:12px;border:1px solid var(--line);border-radius:3px;padding:3px 8px;background:var(--panel)}
.saldo{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--panel);
  border:1px solid var(--cyan);border-radius:6px;padding:11px 14px}
.saldo .b{display:flex;flex-direction:column;gap:1px}
.saldo .v{font-family:var(--num);font-size:27px;font-weight:700;line-height:1;color:var(--cyan)}
.saldo .v.zero{color:var(--vermelho)}
.saldo .s{font-family:var(--num);font-size:17px;font-weight:700;line-height:1}
.saldo .obs{font-size:11.5px;color:var(--dim);max-width:280px;line-height:1.3}
.ct .cst{top:6px;right:32px;font-size:17px;padding:1px 6px;border:1px solid var(--cyan);border-radius:4px}
.ct.no .cst{border-color:var(--line);color:var(--faint)}
.lesao{font-family:var(--num);font-size:10.5px;padding:2px 6px;border-radius:3px;margin-top:6px;
  display:inline-block;background:#3A1A1A;color:#F08080;border:1px solid #6B2E2E}

/* atletas */
.elenco{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:10px}
.atl{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:5px;padding:10px;min-width:0}
.atl.ATQ{border-left-color:var(--atq)}.atl.DEF{border-left-color:var(--def)}
.atl.sel{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
.atl.fora{opacity:.42}
.atl.clic{cursor:pointer}
.atl.clic:hover{border-color:var(--cyan)}
.atl .nm{font-family:var(--disp);font-size:17px;font-weight:600;line-height:1.1}
.atl .pos{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-family:var(--disp)}
.atl .big{font-family:var(--num);font-size:25px;font-weight:700;line-height:1}
.atl .meta{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:7px}
.zona{font-family:var(--num);font-size:11px;padding:2px 6px;border-radius:3px;white-space:nowrap}
/* prévia: o que acontece SE você aplicar a carta nesta atleta.
   Moldura rosa porque é previsão e não estado; o número dentro é colorido pela zona
   que vai resultar, para dizer de uma vez "isto é um palpite" e "o palpite é bom". */
.prev{margin-top:7px;border:1px solid var(--rosa);border-radius:4px;padding:5px 7px;background:#2A1322}
.prev .cab{font-family:var(--disp);font-size:9px;letter-spacing:.12em;color:var(--rosa);display:block;margin-bottom:2px}
.prev .v{font-family:var(--num);font-size:11.5px;line-height:1.4;display:block}
.prev .nada{color:var(--faint);font-style:italic}
.prev .bom{color:#4ED8A0}.prev .meio{color:#F0B850}.prev .ruim{color:#F08080}
.proj{font-family:var(--num);font-size:11px;margin-top:6px;padding:3px 6px;border-radius:3px;
  border:1px dashed var(--line);color:var(--dim);background:transparent}
.proj.alerta{border-style:solid;font-weight:700}
.proj.z-verde{color:#4ED8A0;border-color:#2A6B55}
.proj.z-ambar{color:#F0B850;border-color:#6B5320}
.proj.z-vermelho{color:#F08080;border-color:#6B2E2E;background:#2A1414}
.z-verde{background:#17352C;color:#4ED8A0;border:1px solid #2A6B55}
.z-ambar{background:#3A2C13;color:#F0B850;border:1px solid #6B5320}
.z-vermelho{background:#3A1A1A;color:#F08080;border:1px solid #6B2E2E}
.z-oculta{background:var(--panel2);color:var(--faint);border:1px solid var(--line)}
.progs{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px}
.progs span{font-size:10px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:1px 5px;color:var(--dim)}
.lesbar{display:flex;gap:2px;margin-top:6px}
.lesbar b{display:block;width:13px;height:5px;border-radius:1px;background:var(--line)}
.lesbar b.on{background:var(--vermelho)}

/* arte vetorial das cartas */
.arte{display:block;width:100%;height:auto;aspect-ratio:3/2;background:#0C141D;border:1px solid var(--line);border-radius:4px}
img.arte{object-fit:cover}
.atl .arte{margin-bottom:8px}
.ct .arte{margin-bottom:2px}

/* cartas */
.mao{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:9px}
.ct{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:10px;min-width:0;
  display:flex;flex-direction:column;gap:5px;cursor:pointer;position:relative;text-align:left;font-size:13px}
/* ALTURA UNIFORME, como num baralho de verdade. Não dá para fazer isso com altura fixa
   em pixels, porque a arte é proporcional à largura da coluna e a coluna é elástica.
   A solução é reservar espaço pelos dois blocos que variam — o texto e o rodapé — com
   altura mínima em LINHAS. Como todo o resto da carta (arte, tipo, nome) já tem altura
   determinada, todas acabam idênticas em qualquer largura.
   Os números saíram de medição, não de chute: o texto das 29 cartas tem mediana de 2
   linhas e máxima de 3, então 3 linhas não cortam ninguém e custam uma linha de espaço
   em branco na carta mediana. É o que o Magic faz, e o professor tinha razão: nenhuma
   informação se perde, e dá para comparar duas cartas sem abrir nenhuma. */
.ct .pe{align-content:flex-start}
/* A carta de ATLETA tortava por outro motivo: o selo da zona cabia ao lado do nome
   curto e quebrava para baixo do nome longo, desalinhando a linha toda. O nome agora
   encolhe e o selo nunca quebra. O bloco final (habilidade e passivo) também recebe
   altura mínima, porque quem não tem habilidade tinha a carta mais baixa. */
.atl{display:flex;flex-direction:column}
.atl .topo{flex-wrap:nowrap;align-items:flex-start}
.atl .topo > div:first-child{min-width:0;flex:1 1 auto}
.atl .topo .zona{flex:0 0 auto;white-space:nowrap}
.atl .nm{overflow-wrap:anywhere}
.atl .habpas{margin-top:auto}
.ct:hover:not(.no){border-color:var(--cyan)}
.ct.no{opacity:.4;cursor:not-allowed}
.ct.sel{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
.ct.estatica{cursor:default}
.ct .tp{font-family:var(--disp);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.ct.PROGRAMA .tp{color:var(--verde)}.ct.CONDUTA .tp{color:var(--cyan)}.ct.CONTEXTO .tp{color:var(--roxo)}
.ct .nm{font-family:var(--disp);font-size:16px;font-weight:600;line-height:1.1}
.ct .tx{font-size:12px;color:var(--dim);line-height:1.38}
.ct .cst{position:absolute;top:8px;right:9px;font-family:var(--num);font-size:13px;font-weight:700;color:var(--cyan);
  background:rgba(10,16,24,.82);border-radius:3px;padding:0 4px}
.ct .cg{font-family:var(--num);font-size:11px;color:var(--ambar)}
.ct .cop{position:absolute;top:8px;left:9px;font-family:var(--num);font-size:10px;color:var(--faint);
  background:rgba(10,16,24,.82);border-radius:3px;padding:0 4px}

/* mercado */
.mkt{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:9px}
.mkt .ct.levada{opacity:.3;cursor:not-allowed;filter:grayscale(1)}
.mkt .ct .quem{position:absolute;inset:auto 0 0 0;font-family:var(--disp);font-size:11px;letter-spacing:.08em;
  text-align:center;padding:3px;border-radius:0 0 4px 4px}
.vez{border:1px solid var(--cyan);background:#10242C;border-radius:5px;padding:10px 13px;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vez .q{font-family:var(--disp);font-size:19px;font-weight:700;color:var(--cyan)}
.cnt{display:flex;gap:4px}
.cnt b{display:block;width:9px;height:9px;border-radius:50%;background:var(--line)}
.cnt b.on{background:var(--cyan)}

/* duelo */
.duelo{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.duelo .lado{text-align:center}
.duelo .vs{font-family:var(--disp);font-size:13px;color:var(--faint)}
.duelo .n{font-family:var(--num);font-size:40px;font-weight:700;line-height:1}
.prob{display:flex;flex-direction:column;gap:5px}
.bar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%}
.slot{border:1px dashed var(--line);border-radius:5px;padding:9px;background:var(--panel);min-height:58px;cursor:pointer}
.slot.cheio{border-style:solid}
.slot.sel{border-color:var(--cyan)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.logbox{max-height:230px;overflow-y:auto;font-size:13px;display:flex;flex-direction:column;gap:5px}
.logbox div{padding-bottom:5px;border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--line)}
th{font-family:var(--disp);font-size:11px;letter-spacing:.09em;color:var(--faint);text-transform:uppercase}
.tw{overflow-x:auto}
.sep{height:1px;background:var(--line);margin:4px 0}
input[type=text]{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:4px;
  padding:9px 11px;font-family:var(--corpo);font-size:14px;width:100%;max-width:280px}
.aviso{border-left:3px solid var(--ambar);background:#2A2114;padding:10px 13px;border-radius:0 5px 5px 0;font-size:13px}
.ok{border-left:3px solid var(--verde);background:#14281F;padding:10px 13px;border-radius:0 5px 5px 0;font-size:13px}
.curva{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:11px}
/* mapa de quadra */
.qd{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:11px}
.qd .linha{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.qd .net{height:4px;background:linear-gradient(90deg,var(--line),var(--cyan),var(--line));
  border-radius:2px;margin:9px 0 11px;position:relative}
.qd .net::after{content:"REDE";position:absolute;left:50%;top:-7px;transform:translateX(-50%);
  background:var(--panel2);padding:0 7px;font-family:var(--disp);font-size:10px;letter-spacing:.14em;color:var(--cyan)}
.sl{border:1px dashed var(--line);border-radius:5px;padding:7px;min-height:84px;background:var(--panel);
  cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0;position:relative}
.sl:hover{border-color:var(--cyan)}
.sl.cheio{border-style:solid}
.sl.alvo{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
.sl .pede{font-family:var(--disp);font-size:9.5px;letter-spacing:.07em;color:var(--faint);text-transform:uppercase}
.sl .quem{font-family:var(--disp);font-size:14px;font-weight:600;line-height:1.05}
.sl .vaz{color:var(--faint);font-size:11px;font-style:italic}
.sl .n{font-family:var(--num);font-size:19px;font-weight:700;line-height:1}
.sl .imp{font-size:9.5px;color:var(--ambar);line-height:1.2}
.sl .imp.grave{color:var(--vermelho)}
.sl .zq{font-family:var(--num);font-size:9.5px;padding:1px 4px;border-radius:2px;align-self:flex-start}

/* guia: o que fazer agora */
#guia{position:sticky;top:calc(env(safe-area-inset-top,0px) + 44px);z-index:9;margin-bottom:14px}
#guia.aberto{position:static}
.gbar{display:flex;gap:10px;align-items:center;background:#10242C;border:1px solid var(--cyan);
  border-radius:5px;padding:10px 12px;cursor:pointer}
.gbar .ico{font-family:var(--disp);font-size:13px;font-weight:700;color:#071016;background:var(--cyan);
  border-radius:50%;width:21px;height:21px;display:flex;align-items:center;justify-content:center;flex:0 0 21px}
.gbar .tx{font-size:13.5px;line-height:1.35}
.gbar .ab{margin-left:auto;font-family:var(--disp);font-size:11px;letter-spacing:.08em;color:var(--cyan);white-space:nowrap}
.gpan{background:var(--panel);border:1px solid var(--cyan);border-top:none;border-radius:0 0 5px 5px;padding:13px}
.gpan ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.gpan li::marker{color:var(--cyan);font-weight:700}
.gpan .dec{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:13.5px}
.gpan .dec b{color:var(--cyan);font-family:var(--disp);letter-spacing:.06em;display:block;font-size:11px;margin-bottom:3px}

/* ficha de detalhe (toque, pensada para celular) */
#ficha{position:fixed;inset:0;z-index:50;background:rgba(6,10,15,.82);display:flex;
  align-items:flex-end;justify-content:center;padding:0}
#ficha .sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px 10px 0 0;
  width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:16px;
  padding-bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:11px}
#ficha .alca{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px}
@media(min-width:620px){#ficha{align-items:center}#ficha .sheet{border-radius:10px;max-height:84vh}}
.fseg{border-left:2px solid var(--line);padding:2px 0 2px 11px}
.fseg .lbl{display:block;margin-bottom:3px}
.conselho{border-left:3px solid var(--cyan);background:#10242C;padding:11px 13px;border-radius:0 5px 5px 0;font-size:13.5px}
.info{position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:50%;
  border:1px solid var(--line);background:rgba(10,16,24,.86);color:var(--dim);
  font-family:var(--disp);font-size:12px;font-weight:700;line-height:1;padding:0;
  display:flex;align-items:center;justify-content:center;z-index:2}
.info:hover{border-color:var(--cyan);color:var(--cyan)}
.atl{position:relative}
.ct .cst{right:34px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="hud" hidden><div class="row">
  <div class="row" style="gap:10px">
    <span class="disp" style="font-size:19px;font-weight:700">DOSE</span>
    <div class="tl" id="tl"></div>
  </div>
  <div class="row" id="huddir" style="gap:7px"></div>
</div></div>
<div id="guia"></div>
<div id="app"></div>
<div id="ficha" hidden></div>

<script>
"use strict";
const $ = (s)=>document.querySelector(s);
const el = (t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};
const cl = (v,a,b)=>Math.max(a,Math.min(b,v));
const pct = (v)=>Math.round(v*100)+"%";

/* ══════════════════════ CATÁLOGO · jogadoras, IDÊNTICAS PARA OS DOIS LADOS ══════════════════════
   Revisão 2: não há mais draft de elenco. Os dois grupos recebem estas doze, com os
   mesmos nomes e os mesmos atributos. A partida é um espelho — toda diferença de
   resultado é atribuível à decisão, e é só por isso que o debrief funciona.
   `cro` é a carga a que ela já está adaptada: define a margem que ela tem para treinar. */
const ATLETAS = [
 {id:"marina",  nm:"Marina",   fn:"Oposta",             pos:"ATQ", base:9, cro:5, n:10, pose:"ataque",
  hab:"Potência: +1 na demanda que impõe.", pas:"Crônica alta: destreina se não receber bastante carga.", mods:{demanda:1}},

/* Custo X, como no Magic: você decide o alcance e paga por cabeça.
   É a decisão de triagem de uma comissão técnica — cobrir meia equipe raso ou

const ehX = (c)=>c.alvo==="x";

const rotuloCusto = (c)=>ehX(c) ? (c.custoBase ? "X+"+c.custoBase : "X") : String(c.custo);

                 .filter(a=>c.t!=="PROGRAMA" || !a.progs.includes(c.id));

/* ══════════════════════ SEQUÊNCIA E ECONOMIA ══════════════════════ */
const SEQ = [
 {k:"T",r:"T1"},{k:"T",r:"T2"},{k:"T",r:"T3"},{k:"J",r:"J1"},
 {k:"T",r:"T4"},{k:"T",r:"T5"},{k:"T",r:"T6"},{k:"J",r:"J2"},
];
const CARGA_JOGO = 6;          // a partida é a maior carga da semana
/* O time TREINA JUNTO. Toda atleta recebe esta carga por rodada, de graça e sem carta:
   é o treino coletivo, que na vida real é a maior parte do volume de todo mundo.
   O trabalho individual vem POR CIMA disso — e é aí que mora o perigo, porque quem já
   está no limite com o coletivo estoura com qualquer programa a mais. */
const CARGA_COLETIVA = 3;
const VERBA_PRE = 12;          // pré-temporada: compra ESTRUTURA, não jogadoras
const ENERGIA_BASE = 6;
const ENERGIA_PERDEDOR = 7;    // freio de volume, reduzido de 8 — o resto virou acesso
const MERCADO_VIRADAS = 6;     // cartas para cima por rodada de treino
const ESCOLHAS = 3;            // cada grupo leva 3, alternando
const LIMITE_MAO = 8;

/* ══════════════════════ MOTOR DE CARGA ══════════════════════
   aguda   = soma das 2 últimas rodadas
   crônica = soma das 6 últimas ÷ 3   (mesma unidade da aguda)
   histórico nasce com 6 rodadas no valor da crônica inicial, então toda atleta
   começa em razão 1,00 — e a margem de cada uma é diferente. */
const aguda = (a)=>a.hist.slice(-2).reduce((s,v)=>s+v,0);
const soma6 = (a)=>a.hist.slice(-6).reduce((s,v)=>s+v,0);
const cronica = (a)=>Math.max(.5, soma6(a)/3);
const razao = (a)=>aguda(a)/cronica(a);

function zona(r){ return r<.8 ? "vermelho" : r<=1.25 ? "verde" : r<=1.45 ? "ambar" : "vermelho"; }
function rotuloZona(r){
  if(r<.8) return "destreinada";
  if(r<=1.25) return "dose certa";
  if(r<=1.45) return "atenção";
  return "sobrecarga";
}

/* ── RECUPERAÇÃO REDUZ CARGA AGUDA, COM PISO EM RAZÃO 1,00 ────────────────────────
   Carga aplicada não se desfaz; o que a recuperação faz, lida pelo modelo
   fitness-fadiga, é acelerar o decaimento do componente de fadiga.

   Cuidado que a versão ingênua erra: tirar carga das duas últimas rodadas reduz
   TAMBÉM o denominador, porque a crônica é a soma das seis. Então não basta cortar
   uma fração da aguda e conferir depois. Resolvendo exato, com corte c:
       razão_nova = 3(aguda − c) / (soma6 − c) ≥ 1   ⟺   c ≤ (3·aguda − soma6)/2
   Esse é o corte máximo que não atravessa a dose certa. O piso é estrutural, não
   uma checagem: a recuperação nunca destreina ninguém, e nunca salva quem treinou
   de menos — se a atleta já está em 1,00 ou abaixo, cMax ≤ 0 e a carta não faz nada. */
function reduzAguda(a, frac){
  const ag = aguda(a), s6 = soma6(a);
  const cMax = (3*ag - s6) / 2;
  if(cMax <= 0) return 0;                       // já bem dosada ou destreinada: inútil
  const corte = Math.min(ag * frac, cMax);
  let resto = corte;
  for(let i = a.hist.length - 1; i >= Math.max(0, a.hist.length - 2) && resto > 1e-9; i--){
    const tira = Math.min(a.hist[i], resto);
    a.hist[i] -= tira; resto -= tira;
  }
  return corte - resto;
}

/* curva em U: destreinada e sobrecarregada perdem; no meio, risco baixo.
   A inclinação dos dois braços é parecida de propósito — nenhum dos dois erros
   é mais barato que o outro. */
function riscoCarga(a){
  const r = razao(a);
  let p;
  if(r < .8)       p = .10 + (.8 - r) * .60;
  else if(r<=1.25) p = .05;
  else             p = .05 + (r - 1.25) * .60;
  p -= protecao(a);
  p += (a.mods.riscoExtra || 0);
  if(a.mods.ombro && !temEf(a,"ombroOk")) p += .10;
  return cl(p, .02, .80);
}
const temEf = (a,k)=>a.progs.some(p=>ACAO[p].ef && ACAO[p].ef[k]);
function protecao(a){
  let s = a.mods.protecao || 0;
  for(const p of a.progs) s += (ACAO[p].ef.protecao || 0);
  s += a.tmp.protecao || 0;
  return s;
}
function fadiga(a){
  const r = razao(a);
  let f = Math.max(0, Math.round((r - 1.2) * 2.5));
  let anti = 0; for(const p of a.progs) anti += (ACAO[p].ef.antifadiga || 0);
  return Math.max(0, f - anti);
}
function atributo(a){
  let v = a.base;
  for(const p of a.progs){ const ef = ACAO[p].ef; if(ef.attr) v += ef.attr; }
  /* Bônus de dose certa: rende mais enquanto está na faixa e perde o bônus ao sair
     dela — para cima OU para baixo. É a curva dose-resposta dentro do próprio número
     da carta: treinar demais não fica só mais arriscado, fica pior. */
  if(a.mods.doseCerta && zona(razao(a))==="verde") v += a.mods.doseCerta;
  return Math.max(0, v - fadiga(a) - a.lesao - (a.tmp.attrPenal || 0));
}
const disponivel = (a)=>a.lesao < 3;

/* ── PROJEÇÃO ───────────────────────────────────────────────────────────────
   O problema que isto resolve: na pré-temporada TODA atleta está em "dose certa",
   porque o histórico nasce no valor da crônica dela e ninguém treinou ainda. A carta
   dizia "está tudo bem" exatamente no momento em que é preciso agir — e quem não
   recebe carga nenhuma chega ao jogo em razão 0,00.
   A projeção roda a carga atual até o próximo dia de jogo e mostra onde ela VAI parar.
   É o número que importa para decidir, e não o de agora. */
function rodadasAteJogo(){
  if(!S) return 0;
  let n = 0;
  for(let i = S.rodada; i < SEQ.length; i++){
    if(SEQ[i].k === "J") return n;
    n++;
  }
  return n;
}
function proxJogo(){
  for(let i = S.rodada; i < SEQ.length; i++) if(SEQ[i].k === "J") return SEQ[i].r;
  return null;
}
function projetar(a){
  const n = rodadasAteJogo();
  if(n <= 0) return null;
  const c = {mods:a.mods, progs:a.progs, tmp:a.tmp, lesao:a.lesao, base:a.base,
             hist:a.hist.slice()};
  const cg = cargaRodada(a) * fatorCrido(a);
  let fr = 0; for(const p of a.progs) fr = Math.max(fr, ACAO[p].ef.reduzRodada || 0);
  for(let k=0;k<n;k++){ c.hist.push(cg); if(fr>0) reduzAguda(c, fr); }
  return razao(c);
}

/* manutenção: 1 de energia a cada 2 programas ativos no elenco inteiro.
   Com 12 atletas em vez de 6, manutenção de 1 por programa consumiria a rodada
   toda e o mercado não teria para onde ir. */
function totalProgs(j){ let s=0; for(const a of j.elenco) s += a.progs.length; return s; }
/* 1 de energia a cada 3 programas instalados. Com custo X, cobrir meio elenco gera
   muita instalação — e a manutenção é justamente o que cobra o alcance semana após
   semana, que é como funciona de verdade: programa amplo consome hora de equipe. */
function manutencao(j){ return Math.ceil(totalProgs(j) / 3); }
function cargaIndividual(a){ let c=0; for(const p of a.progs) c += ACAO[p].cg; return c; }
function cargaRodada(a){ return CARGA_COLETIVA + cargaIndividual(a); }

/* ── o fator de resposta ─────────────────────────────────────────────────────
   Não é ruído puro: tem causas, e as causas são as da ementa. Quem entendeu a aula
   consegue prever a DIREÇÃO sem pagar — o que não consegue é prever o valor. */
function centroPSE(a, j){
  let c = a.fat != null ? a.fat : 1;
  if(a.lesao > 0)           c += .10;   // voltando de lesão, o mesmo treino custa mais
  if(j && j.estressePSE)    c += j.estressePSE;   // viagem longa na rodada anterior
  if(temEf(a,"sonoOk"))     c -= .07;   // dormir bem barateia o mesmo treino
  if(temEf(a,"antifadiga")) c -= .05;   // disponibilidade energética idem
  return cl(c, .80, 1.45);
}
function amplitudePSE(a){
  let amp = PSE_RUIDO;
  if(temEf(a,"sonoOk"))     amp -= .04;   // sono e nutrição ESTREITAM a faixa:
  if(temEf(a,"antifadiga")) amp -= .03;   // a atleta fica previsível, que é o ganho real
  return Math.max(.02, amp);
}
function sortearPSE(a, j, rnd){
  const u = (rnd || Math.random)();
  return cl(centroPSE(a,j) + (u*2-1)*amplitudePSE(a), .75, 1.50);
}
const fatorHoje = (a)=> a.fatHoje != null ? a.fatHoje : 1;
/* O que o grupo ACREDITA que vai acontecer: 1,00 enquanto nunca mediu. É de propósito —
   quem não mede projeta errado, e erra sempre para o mesmo lado. */
const fatorCrido = (a)=> a.pseVisto != null ? a.pseVisto : 1;
function cargaPrescrita(a, j){ return cargaRodada(a) + ((j && j.cargaExtra) || 0); }
function cargaReal(a, j){ return cargaPrescrita(a,j) * fatorHoje(a); }
function sortearFatores(rnd){
  for(const j of S.j){
    for(const a of j.elenco) a.fatHoje = sortearPSE(a, j, rnd);
    j.estressePSE = 0;
    j.pseAberta = false;
  }
}

/* dono do objeto-atleta: a grade precisa saber de quem é para ler a PSE do grupo */

/* LESÃO NO TREINO. Na vida real a maior parte das lesões por sobrecarga acontece
   treinando, não jogando — é esse o motivo de monitorar carga. O risco por rodada é
   uma fração do risco de jogo: o gesto de treino é menos extremo que o de competição,
   mas a exposição é muito maior, porque são seis rodadas de treino para dois jogos. */
const FATOR_TREINO = .35;
function riscoTreino(a){ return riscoCarga(a) * FATOR_TREINO; }

function pPonto(dem, cap){ return cl(.50 + (dem - cap) * .06, .08, .92); }
function pLesaoDef(def, dem, cap, imp){ return cl(riscoCarga(def) + Math.max(0, dem - cap) * .07 + (imp||0), .02, .85); }
function pLesaoAtq(atq, imp){ return cl(riscoCarga(atq) + (imp||0), .02, .85); }

  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const k=Math.floor(Math.random()*(i+1)); [a[i],a[k]]=[a[k],a[i]]; }
  return a;
}

function cartaAtleta(a, o){
  o = o || {};
  const w = el("div","atl "+a.pos);
  if(o.sel) w.classList.add("sel");
  if(!disponivel(a)) w.classList.add("fora");
  if(o.clic){ w.classList.add("clic"); w.tabIndex=0; w.onclick=o.clic;
    w.onkeydown=(e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); o.clic(); } }; }
  if(o.arte !== false) w.appendChild(arteAtleta(a));
  const top = el("div","row topo"); top.style.justifyContent="space-between"; top.style.gap="6px";
  const nn = el("div");
  nn.appendChild(el("div","nm",a.nm));
  nn.appendChild(el("div","pos",a.fn+" · "+a.pos));
  top.appendChild(nn);
  const r = razao(a);
  const z = el("span","zona z-"+zona(r), rotuloZona(r));
  top.appendChild(z);
  w.appendChild(top);

  if(o.proj !== false && S && S.fase !== "duelos"){
    const pr = projetar(a);
    const alvo = proxJogo();
    if(pr !== null && alvo){
      const pz = zona(pr);
      const lin = el("div","proj z-"+pz);
      lin.textContent = "no "+alvo+": "+rotuloZona(pr)+"  ("+pr.toFixed(2)+")";
      if(pz !== "verde") lin.classList.add("alerta");
      w.appendChild(lin);
    }
  }

  const meta = el("div","meta");
  const esq = el("div");
  esq.appendChild(el("div","big", String(atributo(a))));
  esq.appendChild(el("div","lbl", a.pos==="ATQ"?"ataque":"defesa"));
  meta.appendChild(esq);
  const dir = el("div"); dir.style.textAlign="right";
  if(o.mostraRazao || a.revelada){
    dir.appendChild(el("div","num", "razão "+r.toFixed(2)));
  } else {
    dir.appendChild(el("div","num faint", "razão ?"));
  }
  const ci = cargaIndividual(a);
  const dono = donoDe(a);
  const presc = cargaPrescrita(a, dono);
  if(o.mostraRazao || a.revelada){
    const ln = el("div","num pse");
    ln.appendChild(el("span","","carga "+nf(presc)+" → "));
    if(dono && dono.pseAberta && a.fatHoje != null){
      const v = el("span","psev", nf(cargaReal(a,dono)));
      v.title = "carga interna medida · fator "+a.fatHoje.toFixed(2);
      ln.appendChild(v);
    } else {
      const q = el("span","pseq","?");
      q.title = "carga interna não medida nesta rodada";
      ln.appendChild(q);
    }
    dir.appendChild(ln);
  } else {
    dir.appendChild(el("div","num faint", "carga "+nf(presc)+"/rod"));
  }
  if(ci) dir.appendChild(el("div","num faint", CARGA_COLETIVA+" coletivo + "+ci+" individual"));
  if(o.mostraCro) dir.appendChild(el("div","num faint","crônica inicial "+a.cro));
  meta.appendChild(dir);
  w.appendChild(meta);

  if(a.progs.length){
    const ps = el("div","progs");
    for(const p of a.progs) ps.appendChild(el("span","",ACAO[p].nm));
    w.appendChild(ps);
  }
  if(a.lesao){
    w.appendChild(el("div","lesao", a.lesao>=3 ? "LESIONADA — fora do jogo"
      : "LESÃO "+a.lesao+" de 3 · −"+a.lesao+" no atributo"));
  }
  const lb = el("div","lesbar");
  for(let i=0;i<3;i++){ const b=el("b"); if(i<a.lesao) b.classList.add("on"); lb.appendChild(b); }
  w.appendChild(lb);
  if(o.info !== false && S){
    const i = el("button","info","i");
    i.title = "Situação de carga de "+a.nm;
    i.setAttribute("aria-label","Detalhes de "+a.nm);
    i.onclick = (e)=>{ e.stopPropagation(); e.preventDefault(); abrirFicha("atleta", a.id); };
    w.appendChild(i);
  }
  if(o.hab){
    const t = el("div","habpas"); t.style.marginTop="7px"; t.style.fontSize="11.5px";
    if(a.hab!=="—"){ const x=el("div","",a.hab); x.style.color="var(--verde)"; t.appendChild(x); }
    if(a.pas!=="—"){ const y=el("div","",a.pas); y.style.color="var(--ambar)"; t.appendChild(y); }
    w.appendChild(t);
  }
  return w;
}

/* ══════════════════════ FICHA DE DETALHE ══════════════════════
   Toque e não passagem de mouse: o jogo roda em celular na mão do aluno. */
function conselho(a){
  const r = razao(a), pr = projetar(a), alvo = proxJogo();
  /* O conselho é sobre ONDE ELA VAI PARAR, não sobre onde está. Na pré-temporada todas
     estão em dose certa e mesmo assim quase todas precisam de intervenção. */
  if(pr !== null && alvo){
    const n = rodadasAteJogo();
    const resta = n + " rodada" + (n>1?"s":"") + " de treino até o " + alvo;
    if(pr < .8) return ["Do jeito que está, ela chega ao " + alvo + " em razão " + pr.toFixed(2)
      + " — DESTREINADA, que machuca tanto quanto treinar demais.\n\nEla precisa de MAIS carga, "
      + "não de descanso: instale um programa nela, ou aumente o que ela já tem. ("+resta+".)", "var(--vermelho)"];
    if(pr > 1.45) return ["Do jeito que está, ela chega ao " + alvo + " em razão " + pr.toFixed(2)
      + " — SOBRECARREGADA.\n\nTire carga dela: dispense um programa, ou guarde uma Descarga "
      + "planejada para jogar na rodada antes do jogo. ("+resta+".)", "var(--vermelho)"];
    if(pr > 1.25) return ["Chega ao " + alvo + " em " + pr.toFixed(2) + ", na faixa de atenção. "
      + "Ainda dá para corrigir sem perder nada: segure a carga, ou um Aquecimento específico "
      + "antes do jogo compensa parte do risco. ("+resta+".)", "var(--ambar)"];
    return ["Do jeito que está, ela chega ao " + alvo + " em razão " + pr.toFixed(2)
      + " — dose certa.\n\nNÃO PRECISA FAZER NADA COM ELA. Gaste a energia em quem está fora "
      + "da faixa, e volte aqui se mudar alguma coisa. ("+resta+".)", "var(--verde)"];
  }
  if(r < .8) return ["Chegou ao jogo DESTREINADA. Nesta altura não há o que fazer por ela "
    + "hoje — a decisão agora é escalar mesmo assim ou improvisar com outra.", "var(--vermelho)"];
  if(r <= 1.25) return ["Na faixa, e chegou bem ao jogo. Pode escalar.", "var(--verde)"];
  if(r <= 1.45) return ["Em atenção no dia de jogo. Bandagem ou atendimento imediato reduzem "
    + "o estrago se der ruim.", "var(--ambar)"];
  return ["Sobrecarregada no dia de jogo. Escalar é aceitar um risco alto de perdê-la; "
    + "a outra saída é improvisar com alguém fora de função.", "var(--vermelho)"];
}

/* ── ALTURA UNIFORME DAS CARTAS ──────────────────────────────────────────────
   Reservar espaço por estimativa não funciona, e a primeira tentativa provou isso:
   a largura da coluna muda com a tela e o texto quebra diferente em cada largura, de
   modo que sempre sobra uma carta estourando a reserva. A única medida confiável é a
   do próprio navegador, depois de desenhar.
   Então: zera as alturas, mede a mais alta de cada grade e aplica em todas. A sobra
   vira espaço em branco embaixo, como num baralho de verdade. Roda a cada desenho e
   a cada mudança de tamanho de janela, porque o projetor e o celular têm larguras
   diferentes e a conta muda nas duas. */
function igualarCartas(){
  /* Globalmente, não por grade: o catálogo tem três grades (programas, condutas,
     contexto) e o elenco tem duas (atacantes, defensoras). Igualar dentro de cada uma
     deixava as seções diferentes entre si, que é o mesmo problema um nível acima. */
  for(const sel of ["#app .ct", "#app .atl"]){
    const itens = [...document.querySelectorAll(sel)];
    if(itens.length < 2) continue;
    for(const c of itens) c.style.minHeight = "";
    let alta = 0;
    for(const c of itens) alta = Math.max(alta, c.getBoundingClientRect().height);
    if(alta > 0) for(const c of itens) c.style.minHeight = Math.ceil(alta) + "px";
  }
}
let reTimer = null;
window.addEventListener("resize", ()=>{
  clearTimeout(reTimer); reTimer = setTimeout(igualarCartas, 120);
});

/* ══════════════════════ DESPACHO DE TELA ══════════════════════ */
/* render = desenhar e DEPOIS igualar, nessa ordem e de forma síncrona.
   A primeira versão agendava a igualação para o próximo quadro de animação, o que
   parecia mais elegante e não funcionava: o agendamento não dispara de forma
   confiável em toda situação, e o resultado era carta de tamanho diferente em parte
   das vezes — defeito intermitente, que é o pior tipo. Chamada direta não tem esse
   problema, e medir 41 cartas uma vez por tela não custa nada. */
function render(){
  desenharTela();
  igualarCartas();
}

    case "treino":       return telaTreino(app);

    case "duelos":       return telaDuelos(app);
    case "resultado":    return telaResultado(app);

/* ══════════════════════ ABERTURA DE RODADA ══════════════════════ */
function cobrarManutencao(j, e){
  /* Reversibilidade com dentes: instalar mais programa do que se consegue manter faz
     o ganho se perder. Cai o instalado mais recentemente, para ser explicável. */
  let m = manutencao(j);
  while(m > e && j.ordem.length){
    const ult = j.ordem.pop();
    const a = j.elenco.find(x=>x.id===ult.aid);
    if(a){ a.progs = a.progs.filter(p=>p!==ult.pid);
      log("Sem energia para manter tudo: "+ACAO[ult.pid].nm+" de "+a.nm+" foi perdido. Reversibilidade.", j.i); }
    m = manutencao(j);
  }
  j.manut = m;
  return Math.max(0, e - m);
}
function iniciaRodada(){
  for(const j of S.j){
    j.energia = 0;
    let e = j.perdeu ? ENERGIA_PERDEDOR : ENERGIA_BASE;
    if(j.limiteEnergia != null){ e = j.limiteEnergia; j.limiteEnergia = null; }
    e += (j.pendEnergia || 0); j.pendEnergia = 0;
    e = Math.max(0, e);
    j.energia = cobrarManutencao(j, e);
  }
  S.mercado = [];
  const n = Math.min(MERCADO_VIRADAS, S.deck.length);
  for(let i=0;i<n;i++) S.mercado.push({id:S.deck.shift(), levada:null});
  S.vezMercado = S.primeiro;
  S.levadas = 0;
  S.atual = S.primeiro;
  S.sel = null;
  sortearFatores();
  S.fase = S.mercado.length ? "mercado" : "treino";
}
const maxPicks = ()=>Math.min(S.mercado.length, 2*ESCOLHAS);

function caixaAvisos(){

  const w = el("div","card stack");

      + v.lesao + " de 3."));
    w.appendChild(d);
  }
  const n = el("p","faint");
  n.textContent = "A maior parte das lesões por sobrecarga acontece treinando, não jogando — "
    + "é por isso que se monitora carga. Cartas de cura funcionam a partir de agora.";
  w.appendChild(n);
  return w;
}

    box.appendChild(cnt);

  }
  vez.appendChild(el("span","num faint","monte: "+S.deck.length+" de "+TOTAL_DECK));
  w.appendChild(vez);

  const g = el("div","mkt");
  S.mercado.forEach((m,k)=>{
    const livre = m.levada===null;
    const c = cartaAcao(m.id, {clic: livre ? ()=>{
      m.levada = S.vezMercado;

      S.levadas++;
      S.vezMercado = 1 - S.vezMercado;
      if(S.levadas >= maxPicks()){ S.fase="treino"; S.atual=S.primeiro; }
      render();
    } : null, no:!livre});
    if(!livre){
      c.classList.add("levada");
      const q = el("div","quem", S.j[m.levada].nome);
      q.style.background = m.levada===0 ? "#2A3F4A" : "#3A2F4A";
      c.appendChild(q);
    }
    g.appendChild(c);
  });
  w.appendChild(g);

  const n = el("p","faint");
  n.textContent = "Cada grupo leva "+ESCOLHAS+", um por vez. Quem escolhe primeiro nesta rodada: "
    + S.j[S.primeiro].nome + (S.j[S.primeiro].perdeu ? " (perdeu o último jogo)" : "") + ".";
  w.appendChild(n);
  app.appendChild(w);
}

/* ══════════════════════ PAINEL DE ALVO ══════════════════════
   Uma tela só para pré-temporada e treino, porque a decisão é a mesma: em quem.
   Carta de custo X mostra o preço subindo a cada atleta marcada — é esse número
   mexendo ao vivo que transforma "cobrir o elenco" numa escolha, e não num rótulo. */
function podeAlvo(c, a){
  if(c.t==="PROGRAMA") return !a.progs.includes(c.id) && (!c.soPos || c.soPos===a.pos);
  if(c.id==="reab" || c.id==="fisio" || c.id==="crio") return a.lesao>0;
  return true;
}
/* ══════════════════════ PRÉVIA DO EFEITO ══════════════════════
   Responde, carta na mão, a pergunta que o jogo não respondia: "o que acontece se eu
   jogar ISTO aqui?" — com o número de depois, não só o de agora. */
const CLASSE_ZONA = {verde:"bom", ambar:"meio", vermelho:"ruim"};
function clonar(a, progsExtra){
  return {mods:a.mods, progs:progsExtra || a.progs.slice(), tmp:Object.assign({},a.tmp),
          lesao:a.lesao, base:a.base, hist:a.hist.slice(), fn:a.fn, pos:a.pos, cro:a.cro, nm:a.nm,
          fat:a.fat, fatHoje:a.fatHoje, pseVisto:a.pseVisto, pse:a.pse};
}
function previsao(c, a){
  const linhas = [];
  const seta = (rot, de, para, classe)=>linhas.push({rot, txt:de+" → "+para, classe});

  if(c.t === "PROGRAMA"){
    if(a.progs.includes(c.id)) return [{rot:"", txt:"ela já tem este programa", classe:"nada"}];
    if(c.soPos && c.soPos !== a.pos) return [{rot:"", txt:"não serve para esta atleta", classe:"nada"}];
    const dep = clonar(a, a.progs.concat([c.id]));
    const at0 = atributo(a), at1 = atributo(dep);
    if(at1 !== at0) seta(a.pos==="ATQ"?"ataque":"defesa", at0, at1, at1>at0?"bom":"ruim");
    const p0 = projetar(a), p1 = projetar(dep), alvo = proxJogo();
    if(p0 !== null && p1 !== null && alvo)
      seta("no "+alvo, rotuloZona(p0)+" "+p0.toFixed(2), rotuloZona(p1)+" "+p1.toFixed(2),
           CLASSE_ZONA[zona(p1)]);
    const r0 = riscoCarga(a), r1 = riscoCarga(dep);
    if(Math.abs(r1-r0) > .005) seta("risco agora", pct(r0), pct(r1), r1<r0?"bom":"ruim");
    if(c.ef && (c.ef.sonoOk || c.ef.antifadiga)){
      const c0 = centroPSE(a, donoDe(a)), c1 = centroPSE(dep, donoDe(a));
      if(c1 < c0 - .001)
        seta("PSE dela", c0.toFixed(2)+"×", c1.toFixed(2)+"×", "bom");
      const amp0 = amplitudePSE(a), amp1 = amplitudePSE(dep);
      if(amp1 < amp0 - .001)
        seta("imprevisibilidade", "±"+amp0.toFixed(2), "±"+amp1.toFixed(2), "bom");
    }
    if(c.cg) linhas.push({rot:"carga", txt:"+"+c.cg+" por rodada daqui em diante", classe:"meio"});
    return linhas;
  }
  if(c.id === "descarga"){
    const dep = clonar(a);
    const corte = reduzAguda(dep, c.ef.reduzAguda);
    if(corte <= .01) return [{rot:"", txt:"não faz nada: ela já está em 1,00 ou abaixo", classe:"nada"}];
    seta("razão", razao(a).toFixed(2), razao(dep).toFixed(2), CLASSE_ZONA[zona(razao(dep))]);
    seta("risco", pct(riscoCarga(a)), pct(riscoCarga(dep)), "bom");
    linhas.push({rot:"preço", txt:"−"+c.ef.attrPenal+" de atributo até o próximo jogo", classe:"ruim"});
    return linhas;
  }
  if(["crio","fisio","reab","peace"].includes(c.id)){
    if(!a.lesao) return [{rot:"", txt:"ela não tem lesão para curar", classe:"nada"}];
    const n = {crio:1, fisio:2, reab:3, peace:1}[c.id];
    const m = Math.max(0, n - (a.mods.curaMenos||0));
    seta("lesão", a.lesao+" de 3", Math.max(0,a.lesao-m)+" de 3", "bom");
    if(m < n) linhas.push({rot:"", txt:"recuperação lenta: cura "+(n-m)+" a menos nela", classe:"meio"});
    if(c.id==="peace") linhas.push({rot:"e ainda", txt:"−15 p.p. de risco até o próximo jogo", classe:"bom"});
    return linhas;
  }
  if(c.id === "aquecimento"){
    const dep = clonar(a); dep.tmp.protecao = (dep.tmp.protecao||0) + c.ef.protecaoTmp;
    seta("risco", pct(riscoCarga(a)), pct(riscoCarga(dep)), "bom");
    return linhas;
  }
  if(c.id === "teste")
    return [{rot:"", txt: a.revelada ? "a razão dela já está revelada"
      : "revela a razão exata dela — hoje você só vê a zona", classe: a.revelada?"nada":"bom"}];
  return [];
}
function tiraPrevia(c, a){
  const l = previsao(c, a);
  if(!l.length) return null;
  const w = el("div","prev");
  w.appendChild(el("span","cab","se aplicar aqui"));
  for(const x of l){
    const s = el("span","v "+(x.classe||""));
    s.textContent = (x.rot ? x.rot+": " : "") + x.txt;
    w.appendChild(s);
  }
  return w;
}

function painelAlvo(j, o, c, moeda){
  const sel = S.sel;
  if(!sel.escolhidas) sel.escolhidas = [];
  let lista = c.alvo==="atletaAdv" ? o.elenco : j.elenco;
  if(sel.fixo && c.soPos) lista = lista.filter(a=>a.pos===c.soPos);
  const saldo  = moeda==="verba" ? j.verba : j.energia;
  const unidade= moeda==="verba" ? "de verba" : "⚡";
  const box = el("div","card stack");

  const top = el("div","row"); top.style.justifyContent="space-between"; top.style.alignItems="flex-start";
  const tt = el("div");
  tt.appendChild(el("div","lbl", sel.fixo ? "Elenco inteiro — você não escolhe quem"
    : ehX(c) ? "Escolha X atletas — o custo acompanha" : "Alvo"));
  tt.appendChild(el("h3","", c.nm));
  tt.appendChild(el("p","dim", c.tx));
  top.appendChild(tt);
  const custoAgora = custoDe(c, sel.escolhidas.length);
  const pg = el("div"); pg.style.textAlign="right"; pg.style.whiteSpace="nowrap";
  const nX = el("div","num"); nX.style.fontSize="26px"; nX.style.fontWeight="700";
  nX.style.color = custoAgora > saldo ? "var(--vermelho)" : "var(--cyan)";
  nX.textContent = custoAgora + " " + unidade;
  pg.appendChild(nX);
  if(ehX(c)) pg.appendChild(el("div","num faint", "X = "+sel.escolhidas.length
    + (c.custoBase ? "  +  "+c.custoBase+" de base" : "")));
  pg.appendChild(el("div","lbl", "você tem "+saldo));
  top.appendChild(pg);
  box.appendChild(top);

  if(sel.fixo){
    const av = el("div","aviso");
    av.textContent = "Esta carta pega TODAS — inclusive quem já está no limite. Olhe a tarja rosa "
      + "de cada uma antes de confirmar: a mesma carga que acerta uma pode estourar a outra.";
    box.appendChild(av);
  } else if(c.t==="PROGRAMA" && ehX(c)){
    const av = el("div","aviso");
    av.textContent = "Cada instalação também cobra manutenção todo turno e soma "+c.cg
      + " de carga por rodada naquela atleta. Alcance custa uma vez; manter custa sempre.";
    box.appendChild(av);
  }

  const g = el("div","elenco");
  for(const a of lista){
    const pode = podeAlvo(c, a);
    const marcada = sel.escolhidas.includes(a.id);
    const cab = ehX(c) && !marcada && custoDe(c, sel.escolhidas.length+1) > saldo;
    const ca = cartaAtleta(a,{arte:false, sel:marcada,
      mostraRazao: c.alvo!=="atletaAdv" || a.revelada,
      clic: sel.fixo ? null : (pode && (!cab || marcada)) ? ()=>{
        if(!ehX(c)) return aplicarEm(j, o, c, [a], moeda);
        const k = sel.escolhidas.indexOf(a.id);
        if(k>=0) sel.escolhidas.splice(k,1); else sel.escolhidas.push(a.id);
        render();
      } : null});
    if(!pode || cab) ca.style.opacity=".38";
    const pv = tiraPrevia(c, a);
    if(pv) ca.appendChild(pv);
    g.appendChild(ca);
  }
  box.appendChild(g);

  const r = el("div","row");
  if(ehX(c) || sel.fixo){
    const n = sel.escolhidas.length;
    const b = el("button","pri", (sel.fixo ? "Aplicar nas "+n+" — paga " : "Aplicar em "+n+" — paga ")+custoAgora);
    b.disabled = !n || custoAgora > saldo;
    b.onclick = ()=>aplicarEm(j, o, c, sel.escolhidas.map(id=>lista.find(a=>a.id===id)).filter(Boolean), moeda);
    r.appendChild(b);
  }
  const bb = el("button","ghost","Cancelar"); bb.onclick=()=>{ S.sel=null; render(); };
  r.appendChild(bb);
  box.appendChild(r);
  return box;
}

/* ══════════════════════ TELA · TREINO ══════════════════════ */
/* ── PSE DA SESSÃO ───────────────────────────────────────────────────────────
   O botão mais barato do jogo e o que mais muda a decisão. Revela, nesta rodada,
   quanto cada atleta REALMENTE pagou pelo treino que você prescreveu.
   Repare no que ele NÃO faz: não corrige nada. Medir custa energia que ia para o
   treino, e depois de medir você ainda precisa gastar para ajustar. É o ponto da
   aula 04 — monitorar não previne; monitorar diz quando intervir. */
function caixaPSE(j){
  const w = el("div","card stack pseBox");
  const t = el("div","row");
  t.appendChild(el("div","lbl","Carga interna · PSE da sessão"));
  w.appendChild(t);
  if(j.pseAberta){
    const med = j.elenco.map(a=>({a, f:fatorHoje(a)})).sort((x,y)=>y.f-x.f);
    const alta = med.filter(m=>m.f >= 1.12);
    w.appendChild(el("p","", alta.length
      ? "Medido. Quem pagou mais caro pelo mesmo treino: "
        + alta.map(m=>m.a.nm+" ("+m.f.toFixed(2)+"×)").join(" · ") + "."
      : "Medido. Ninguém pagou muito acima do prescrito nesta rodada."));
    w.appendChild(el("p","faint","A carga que entra na razão aguda:crônica é a da direita, "
      + "não a que você prescreveu. A projeção de cada atleta passou a usar o fator medido."));
  } else {
    w.appendChild(el("p","","O número de carga na carta é o que você "
      + "PRESCREVEU. O que cada atleta paga por ele é diferente, e muda com sono, "
      + "viagem e lesão recente. Enquanto não medir, a projeção supõe que todas pagam 1,00× "
      + "— e algumas não pagam."));
    const b = el("button","pri","Colher a PSE da sessão · "+PSE_CUSTO+" ⚡");
    b.disabled = j.energia < PSE_CUSTO;
    b.onclick = ()=>{
      j.energia -= PSE_CUSTO; j.pseAberta = true;
      for(const a of j.elenco) a.pseVisto = fatorHoje(a);
      log(j.nome+" colheu a PSE da sessão.", j.i);
      render();
    };
    w.appendChild(b);
    if(j.energia < PSE_CUSTO) w.appendChild(el("p","faint","Sem energia para medir nesta rodada."));
  }
  return w;
}

function telaTreino(app){

  st.appendChild(b1);

      S.sel = {tipo:"mao", id, k, fixo:c.alvo==="todas",

  const sa = el("div","stack");
  sa.appendChild(el("div","lbl","Elenco de "+o.nome+" · zona é pública, a casa decimal se compra"));
  const ga = el("div","elenco");
  for(const a of o.elenco) ga.appendChild(cartaAtleta(a,{arte:false, mostraRazao:o.scout||a.revelada}));
  sa.appendChild(ga);

  const rr = el("div","row");
  const b = el("button","pri", S.atual===S.primeiro ? "Terminar — passar para "+adv(S.atual).nome : "Terminar a rodada "+r.r);
  b.disabled = j.mao.length > LIMITE_MAO;
  b.onclick = ()=>{
    if(S.atual===S.primeiro){
      S.atual = 1-S.atual; S.sel=null;

    } else { avancarRodada(); }
  };
  rr.appendChild(b);
  w.appendChild(rr);
  app.appendChild(w);
}

/* ══════════════════════ APLICAR CARTA (fora do duelo) ══════════════════════ */
function curar(a, n){
  const m = Math.max(0, n - (a.mods.curaMenos || 0));
  a.lesao = Math.max(0, a.lesao - m);
  return m;
}
function aplicarEm(j, o, c, alvos, moeda){
  alvos = alvos || [];
  const custo = custoDe(c, alvos.length);
  if(moeda==="verba"){ if(custo > j.verba) return; j.verba -= custo; }
  else {
    if(custo > j.energia) return;
    j.energia -= custo;
    const i = j.mao.indexOf(c.id);
    if(i>=0) j.mao.splice(i,1);
  }
  const a = alvos[0];
  const nomes = alvos.map(x=>x.nm).join(", ");
  let msg = j.nome+" jogou "+c.nm;

  if(c.t==="PROGRAMA"){
    for(const x of alvos){ x.progs.push(c.id); j.ordem.push({aid:x.id, pid:c.id}); }
    msg += " em "+alvos.length+" atleta(s) — "+nomes+" (carga +"+c.cg+"/rodada em cada)";
    j.manut = manutencao(j);
  } else if(c.id==="aquecimento"){
    for(const x of alvos) x.tmp.protecao = (x.tmp.protecao||0) + c.ef.protecaoTmp;
    msg += " em "+nomes+": −"+Math.round(c.ef.protecaoTmp*100)+" p.p. de risco em cada até o próximo jogo";
  } else if(c.id==="coletivo"){
    j.cargaExtra = (j.cargaExtra||0) + 3;
    msg += ": +3 de carga em TODO o seu elenco nesta rodada — inclusive em quem não aguenta";
  } else if(c.id==="crio"){
    const tot = alvos.reduce((s,x)=>s+curar(x,1), 0);
    msg += " em "+nomes+" (curou "+tot+" no total)";
  } else if(c.id==="descarga"){
    const corte = reduzAguda(a, c.ef.reduzAguda);
    if(corte > 0.01){
      a.tmp.attrPenal = (a.tmp.attrPenal || 0) + c.ef.attrPenal;
      msg += " em "+a.nm+": carga aguda caiu "+corte.toFixed(1)+", razão agora "+razao(a).toFixed(2)
          +" — e ela chega ao jogo "+c.ef.attrPenal+" menos afiada";
    } else {
      msg += " em "+a.nm+" — e não fez nada: ela já estava em 1,00 ou abaixo. "
          +"Recuperação não substitui treino, e não cobrou atributo porque não houve descarga";
    }
  } else if(c.id==="fisio"){ const m=curar(a,2); msg += " em "+a.nm+" (curou "+m+")";
  } else if(c.id==="reab"){ const m=curar(a,3); msg += " em "+a.nm+" (curou "+m+")";
  } else if(c.id==="peace"){ const m=curar(a,1); a.tmp.protecao=(a.tmp.protecao||0)+.15;
    msg += " em "+a.nm+" (curou "+m+", −15 p.p. até o próximo jogo)";
  } else if(c.id==="teste"){ a.revelada=true; msg += " em "+a.nm+": razão "+razao(a).toFixed(2);
  } else if(c.id==="scout"){ o.scout=true; msg += ": razões de todo o elenco de "+o.nome+" reveladas";
  } else if(c.id==="calend"){ o.limiteEnergia=2; msg += ": "+o.nome+" terá só 2 de energia na próxima rodada";
  } else if(c.id==="viagem"){ o.cargaExtra=(o.cargaExtra||0)+2; o.estressePSE=(o.estressePSE||0)+.12;
    msg += ": +2 de carga em todo o elenco de "+o.nome+" nesta rodada, e a PSE delas sobe na próxima";
  } else if(c.id==="diretoria"){ j.energia += 3; j.pendEnergia = (j.pendEnergia||0) - 2;
    msg += ": +3 agora, −2 na próxima";
  }
  log(msg+".", j.i);
  S.sel = null;
  render();
}
/* compatibilidade com as chamadas de alvo único */
const aplicar = (j,o,c,a)=>aplicarEm(j,o,c,a?[a]:[], "energia");

/* ══════════════════════ FIM DE RODADA ══════════════════════ */
function avancarRodada(){
  const r = rodadaAtual();
  S.avisos = [];   /* guarda só o que aconteceu na rodada que está fechando agora */
  for(const j of S.j){
    const extra = j.cargaExtra || 0;
    for(const a of j.elenco){
      /* o que você prescreveu × o que ela pagou. Só o segundo entra na razão. */
      const presc = cargaRodada(a) + extra;
      const real  = presc * fatorHoje(a);
      a.pse.push({r:r.r, presc, fat:fatorHoje(a), real, medida:!!j.pseAberta});
      if(j.pseAberta) a.pseVisto = fatorHoje(a);
      a.hist.push(real);
      /* recuperação contínua: puxa na direção de 1,00 e para ali */
      let fr = 0;
      for(const p of a.progs) fr = Math.max(fr, ACAO[p].ef.reduzRodada || 0);
      if(fr > 0) reduzAguda(a, fr);
      if(temEf(a,"curaLenta")){
        a.tmp.sono = (a.tmp.sono||0) + 1;
        if(a.tmp.sono >= 2){ a.tmp.sono = 0; if(a.lesao>0) curar(a,1); }
      }
      a.serie.push({r:r.r, aguda:aguda(a), cronica:cronica(a), razao:razao(a)});
      /* a conta do excesso é cobrada aqui, no treino, e não só no dia de jogo */
      if(disponivel(a)){
        const p = riscoTreino(a);
        if(Math.random() < p){
          ferir(a, 1, "sobrecarga no treino", p);
          S.avisos.push({j:j.i, nm:a.nm, razao:razao(a), p,
            zona:rotuloZona(razao(a)), lesao:a.lesao});
        }
      }
    }
  }
  for(const j of S.j) j.cargaExtra = 0;
  S.rodada++;
  S.sel = null;
  if(S.rodada >= SEQ.length){ S.fase="relatorio"; render(); return; }
  if(rodadaAtual().k === "J"){
    sortearFatores();           /* o dia de jogo também tem fator, e ninguém o mede antes */
    S.fase = "escalacao"; S.atual = 0;
    for(const j of S.j){ j.quadra = {}; j.energia = Math.max(j.energia, 2); }
    S.slotSel = null;
    passar(S.j[0].nome, "Dia de jogo. Escale 3 atacantes e 3 defensoras em segredo. "
      + adv(0).nome + " não deve ver esta tela.", ()=>render());
    return;
  }
  iniciaRodada();
  render();
}

/* ══════════════════════ QUADRA E IMPROVISO ══════════════════════
   Seis posições, cada uma pedindo uma função. Escalar fora da função custa atributo e
   risco: a atleta executa um gesto para o qual o tecido dela não está condicionado,
   que é capacidade × demanda no nível do gesto — o conteúdo da aula 13.
   A rede ataca o fundo adversário na DIAGONAL, como um ataque cruzado de verdade. */
const QUADRA = [
 {id:"r4", lin:"rede",  nm:"Rede esquerda",  pede:"Ponteira", contra:"f1"},
 {id:"r3", lin:"rede",  nm:"Rede meio",      pede:"Central",  contra:"f6"},
 {id:"r2", lin:"rede",  nm:"Rede direita",   pede:"Oposta",   contra:"f5"},
 {id:"f5", lin:"fundo", nm:"Fundo esquerda", pede:"Líbero"},
 {id:"f6", lin:"fundo", nm:"Fundo meio",     pede:"Líbero"},
 {id:"f1", lin:"fundo", nm:"Fundo direita",  pede:"Central"},
];
const SLOT = Object.fromEntries(QUADRA.map(s=>[s.id,s]));
function familia(fn){
  if(/Oposta/.test(fn))   return "Oposta";
  if(/Ponteira/.test(fn)) return "Ponteira";
  if(/Central/.test(fn))  return "Central";
  return "Líbero";
}
function improviso(slotId, a){
  if(!a) return {attr:0, risco:0, rot:null, grave:false};
  const s = SLOT[slotId], f = familia(a.fn);
  if(f === s.pede) return {attr:0, risco:0, rot:null, grave:false};
  /* líbero na rede é o caso extremo: no vôlei de verdade ela nem pode atacar de cima */
  if(s.lin === "rede" && f === "Líbero")
    return {attr:4, risco:.15, rot:"líbero na rede · −4 e +15 p.p.", grave:true};
  return {attr:2, risco:.08, rot:"improviso · −2 e +8 p.p.", grave:false};
}
const naQuadra = (j)=>QUADRA.map(s=>j.quadra[s.id]).filter(Boolean);
const atletaEm = (j, slotId)=>j.elenco.find(a=>a.id === j.quadra[slotId]) || null;

function mapaQuadra(j, opts){
  opts = opts || {};
  const w = el("div","qd");
  const faz = (linha)=>{
    const g = el("div","linha");
    for(const s of QUADRA.filter(x=>x.lin===linha)){
      const a = atletaEm(j, s.id);
      const imp = improviso(s.id, a);
      const b = el(opts.clic ? "button" : "div", "sl" + (a ? " cheio" : "")
        + (opts.slotSel===s.id ? " alvo" : ""));
      b.appendChild(el("div","pede", s.nm + " · pede " + s.pede));
      if(a){
        const top = el("div","row"); top.style.justifyContent="space-between"; top.style.gap="5px";
        top.appendChild(el("div","quem", a.nm));
        top.appendChild(el("div","n", String(Math.max(0, atributo(a) - imp.attr))));
        b.appendChild(top);
        const r = razao(a);
        b.appendChild(el("span","zq z-"+zona(r), rotuloZona(r)));
        if(imp.rot) b.appendChild(el("div","imp"+(imp.grave?" grave":""), imp.rot));
        else b.appendChild(el("div","imp","na função"));
      } else {
        b.appendChild(el("div","vaz","vazia — toque para escalar"));
      }
      if(opts.clic) b.onclick = ()=>opts.clic(s.id);
      g.appendChild(b);
    }
    return g;
  };
  w.appendChild(faz("rede"));
  w.appendChild(el("div","net"));
  w.appendChild(faz("fundo"));
  return w;
}

/* ══════════════════════ TELA · ESCALAÇÃO (a única coisa secreta) ══════════════════════ */
function telaEscalacao(app){
  const j = S.j[S.atual];
  if(!j.quadra) j.quadra = {};
  const w = el("div","stack");
  w.appendChild(el("h2","","Escalação secreta · "+j.nome+" · "+rodadaAtual().r));
  w.appendChild(legenda(["improviso","atributo","fadiga","dose certa"]));

  w.appendChild(mapaQuadra(j, {slotSel:S.slotSel, clic:(sid)=>{
    if(j.quadra[sid]){ delete j.quadra[sid]; S.slotSel = null; }
    else S.slotSel = (S.slotSel === sid ? null : sid);
    render();
  }}));

  if(S.slotSel){
    const s = SLOT[S.slotSel];
    const box = el("div","card stack");
    box.appendChild(el("div","lbl", s.nm + " — pede " + s.pede));
    box.appendChild(el("h3","","Quem joga aqui?"));
    const usadas = naQuadra(j);
    const g = el("div","elenco");
    const ordem = j.elenco.slice().sort((a,b)=>{
      const fa = familia(a.fn)===s.pede ? 0 : 1, fb = familia(b.fn)===s.pede ? 0 : 1;
      return fa - fb || atributo(b) - atributo(a);
    });
    for(const a of ordem){
      const ja = usadas.includes(a.id);
      const pode = disponivel(a) && !ja;
      const imp = improviso(S.slotSel, a);
      const ca = cartaAtleta(a,{arte:false, mostraRazao:true,
        clic: pode ? ()=>{ j.quadra[S.slotSel] = a.id; S.slotSel = null; render(); } : null});
      if(!pode) ca.style.opacity=".35";
      const tag = el("div","lbl");
      if(!disponivel(a)){ tag.textContent="fora — 3 de lesão"; tag.style.color="var(--vermelho)"; }
      else if(ja){ tag.textContent="já escalada"; }
      else if(imp.rot){ tag.textContent=imp.rot; tag.style.color= imp.grave ? "var(--vermelho)" : "var(--ambar)"; }
      else { tag.textContent="na função — sem penalidade"; tag.style.color="var(--verde)"; }
      tag.style.marginTop="6px"; ca.appendChild(tag);
      g.appendChild(ca);
    }
    box.appendChild(g);
    const bb = el("button","ghost","Cancelar"); bb.onclick=()=>{ S.slotSel=null; render(); };
    box.appendChild(bb);
    w.appendChild(box);
    app.appendChild(w); return;
  }

  const imps = QUADRA.map(s=>improviso(s.id, atletaEm(j, s.id))).filter(i=>i.rot);
  if(imps.length){
    const av = el("div","aviso");
    av.textContent = imps.length + " atleta(s) escalada(s) fora de função. Improviso é uma decisão "
      + "legítima — às vezes é melhor que escalar uma titular sobrecarregada — mas custa atributo "
      + "e aumenta o risco de lesão no duelo.";
    w.appendChild(av);
  }

  const r = el("div","row");
  const pronto = naQuadra(j).length === 6;
  const b = el("button","pri", S.atual===0 ? "Confirmar e passar o aparelho" : "Revelar as duas quadras");
  b.disabled = !pronto;
  b.onclick = ()=>{
    S.slotSel = null;
    if(S.atual===0){
      S.atual = 1;
      passar(S.j[1].nome, "A quadra de "+S.j[0].nome+" está travada e escondida. Agora é a sua.", ()=>render());
    } else { montarDuelos(); S.fase="duelos"; S.di=0; render(); }
  };
  r.appendChild(b);
  if(!pronto) r.appendChild(el("span","faint", (6-naQuadra(j).length)+" posição(ões) vazia(s)."));
  w.appendChild(r);
  app.appendChild(w);
}

/* ══════════════════════ DUELOS ══════════════════════ */
function montarDuelos(){
  S.duelos = [];
  for(const s of QUADRA.filter(x=>x.lin==="rede")){
    for(const ia of [0,1]){
      const idf = 1-ia;
      const atq = atletaEm(S.j[ia], s.id), def = atletaEm(S.j[idf], s.contra);
      if(!atq || !def) continue;
      S.duelos.push({ia, idf, atq, def, slotA:s.id, slotD:s.contra,
                     impA:improviso(s.id, atq), impD:improviso(s.contra, def),
                     mod:{dem:0,cap:0,evita:0,bonus:0,falta:null}, usadas:[], feito:false, res:null});
    }
  }
}
function demanda(d){ return Math.max(0, atributo(d.atq) + (d.atq.mods.demanda||0) - d.impA.attr + d.mod.dem); }
function capacidade(d){ return Math.max(0, atributo(d.def) - d.impD.attr + d.mod.cap); }

function podeNoDuelo(c, pi, d){
  if(c.quando!=="jogo" && c.quando!=="sempre") return false;
  if(c.id==="invasao" || c.id==="troca" || c.id==="crio") return true;
  if(c.alvo==="duelo")    return (c.id==="banda"||c.id==="imediato") ? pi===d.idf : pi===d.ia;
  if(c.alvo==="dueloAdv") return pi===d.idf;
  return false;
}
function intervir(pi, id, alvoAtl){
  const j = S.j[pi], d = S.duelos[S.di], c = ACAO[id];
  if(c.custo > j.energia) return;
  j.energia -= c.custo;
  const i = j.mao.indexOf(id); if(i>=0) j.mao.splice(i,1);
  let msg = j.nome+" jogou "+c.nm;
  if(c.id==="banda"){ d.mod.cap += 2; msg += ": +2 de capacidade para "+d.def.nm; }
  else if(c.id==="imediato"){ d.mod.evita += 1; msg += ": 1 ponto de lesão evitado neste duelo"; }
  else if(c.id==="tempo"){ d.mod.dem -= 2; msg += ": −2 na demanda de "+d.atq.nm; }
  else if(c.id==="acelerado"){ d.mod.dem += 3; msg += ": +3 na demanda de "+d.atq.nm; }
  else if(c.id==="saque"){ d.mod.dem += 2; d.mod.bonus += 1; msg += ": +2 de demanda e +1 ponto se vencer"; }
  else if(c.id==="crio"){ const m=curar(alvoAtl,1); msg += " em "+alvoAtl.nm+" (curou "+m+")"; }
  else if(c.id==="troca"){ const m=curar(alvoAtl,1); msg += ": "+alvoAtl.nm+" sai com 1 ponto de lesão a menos ("+m+")"; }
  else if(c.id==="invasao"){
    /* Trauma agudo: o entorse acontece pela aterrissagem, não pela planilha. Por isso
       o piso é 1 e não depende de carga nenhuma — é o contínuo agudo × overuse da
       aula 01. O que a carga e a preparação decidem é a GRAVIDADE, não o evento. */
    const r = razao(alvoAtl);
    const prot = alvoAtl.progs.includes("propri") || alvoAtl.progs.includes("banda")
              || (alvoAtl.tmp && alvoAtl.tmp.banda);
    let n = 1, pq = ["trauma da aterrissagem"];
    if(r > 1.45){ n += 1; pq.push("em sobrecarga, razão "+r.toFixed(2)+" — fadiga piora o controle da aterrissagem"); }
    if(prot){ n -= 1; pq.push("protegida por propriocepção ou bandagem"); }
    n = Math.max(1, n);
    ferir(alvoAtl, n, "entorse de tornozelo · "+pq.join(" · "), null);
    d.mod.falta = pi;      /* invadir é falta: o ponto do duelo é da adversária */
    msg += " em "+alvoAtl.nm+": entorse de tornozelo, "+n+" de lesão"
        + (prot ? " (a propriocepção segurou um ponto)" : "")
        + ". É falta — o ponto do duelo vai para " + S.j[1-pi].nome;
    alvoAtl.revelada = true;
  }
  log(msg+".", pi);
  S.sel = null;
  render();
}
function ferir(a, n, motivo, prob){
  let q = n;
  if(a.mods.absorve && !a.usouAbsorve){ a.usouAbsorve = true; q = Math.max(0, q-1);
    if(q<n) log(a.nm+" absorveu 1 ponto de lesão (constância).", null); }
  if(q<=0) return 0;
  a.lesao = Math.min(3, a.lesao + q);
  a.eventos.push({r:SEQ[S.rodada].r, motivo, prob});
  log(a.nm+": "+q+" de lesão — "+motivo+(prob!=null?" ("+pct(prob)+" aceito)":"")+".", null);
  return q;
}

function telaDuelos(app){
  const w = el("div","stack");
  const d = S.duelos[S.di];
  w.appendChild(el("h2","","Duelo "+(S.di+1)+" de 6 · "+rodadaAtual().r));
  w.appendChild(legenda(["demanda","capacidade","p.p."]));

  const dem = demanda(d), cap = capacidade(d);
  const pp = pPonto(dem, cap);
  const pld = pLesaoDef(d.def, dem, cap, d.impD.risco);
  const pla = pLesaoAtq(d.atq, d.impA.risco);

  const du = el("div","duelo card");
  const lado = (ji, a, imp, slotId, valor, rot)=>{
    const e = el("div","lado");
    e.appendChild(el("div","lbl", S.j[ji].nome+" · "+SLOT[slotId].nm));
    e.appendChild(el("div","nm disp", a.nm));
    e.appendChild(el("div","n", String(valor)));
    e.appendChild(el("div","lbl", rot));
    const z = razao(a);
    e.appendChild(el("span","zona z-"+zona(z), rotuloZona(z)));
    if(imp.rot){
      const w2 = el("div","lbl", imp.rot);
      w2.style.color = imp.grave ? "var(--vermelho)" : "var(--ambar)";
      w2.style.marginTop = "5px";
      e.appendChild(w2);
    }
    return e;
  };
  du.appendChild(lado(d.ia, d.atq, d.impA, d.slotA, dem, "demanda"));
  du.appendChild(el("div","vs","ataca na diagonal"));
  du.appendChild(lado(d.idf, d.def, d.impD, d.slotD, cap, "capacidade"));
  w.appendChild(du);

  const pb = el("div","card prob");
  pb.appendChild(el("div","lbl","A chance está à vista antes de confirmar"));
  pb.appendChild(linhaProb("ponto para "+S.j[d.ia].nome, pp, "var(--atq)"));
  pb.appendChild(linhaProb("lesão em "+d.def.nm+" (defesa)", pld, "var(--vermelho)"));
  pb.appendChild(linhaProb("lesão em "+d.atq.nm+" (ataque)", pla, "var(--vermelho)"));
  const n = el("p","faint");
  n.textContent = "Risco é probabilidade, não destino. Razão 1,8 não garante lesão, e ninguém se "
    + "machucar não significa que a dose estava certa.";
  pb.appendChild(n);
  w.appendChild(pb);

  /* instants dos dois lados — informação aberta, os dois respondem */
  for(const pi of [d.ia, d.idf]){
    const j = S.j[pi];
    const disp = j.mao.filter(id=>podeNoDuelo(ACAO[id], pi, d));
    if(!disp.length) continue;
    const sec = el("div","stack");
    sec.appendChild(el("div","lbl", j.nome+" pode intervir · energia "+j.energia));
    const g = el("div","mao");
    for(const id of disp){
      const c = ACAO[id];
      const no = c.custo > j.energia;
      g.appendChild(cartaAcao(id,{no, clic: no?null:()=>{
        if(c.id==="invasao"){ S.sel={tipo:"duelo", pi, id, alvos:"adv"}; render(); }
        else if(c.id==="troca"||c.id==="crio"){ S.sel={tipo:"duelo", pi, id, alvos:"meu"}; render(); }
        else intervir(pi, id, null);
      }}));
    }
    sec.appendChild(g);
    w.appendChild(sec);
  }

  if(S.sel && S.sel.tipo==="duelo"){
    const pi = S.sel.pi, c = ACAO[S.sel.id];
    const lista = S.sel.alvos==="adv" ? S.j[1-pi].elenco : S.j[pi].elenco;
    const box = el("div","card stack");
    box.appendChild(el("div","lbl","Alvo de "+c.nm));
    const g = el("div","elenco");
    for(const a of lista){
      g.appendChild(cartaAtleta(a,{arte:false, mostraRazao: S.sel.alvos==="meu" || a.revelada,
        clic: ()=>intervir(pi, S.sel.id, a)}));
    }
    box.appendChild(g);
    const bb=el("button","ghost","Cancelar"); bb.onclick=()=>{ S.sel=null; render(); };
    box.appendChild(bb);
    w.appendChild(box);
  }

  const r = el("div","row");
  const b = el("button","pri","Resolver o duelo");
  b.onclick = resolver;
  r.appendChild(b);
  w.appendChild(r);

  if(S.log.length){
    const lb = el("div","card logbox");
    S.log.slice(0,8).forEach(l=>{ const d2=el("div"); d2.appendChild(el("span","lbl",l.r+" ")); d2.appendChild(document.createTextNode(l.txt)); lb.appendChild(d2); });
    w.appendChild(lb);
  }
  app.appendChild(w);
}

function resolver(){
  const d = S.duelos[S.di];
  const dem = demanda(d), cap = capacidade(d);
  const pp = pPonto(dem,cap), pld = pLesaoDef(d.def,dem,cap,d.impD.risco), pla = pLesaoAtq(d.atq,d.impA.risco);
  const g = S.jogo;

  if(d.atq.expulsa || d.def.expulsa){
    log("Atleta expulsa: o duelo "+(S.di+1)+" não é disputado.", null);
  } else if(d.mod.falta != null){
    const vit = 1 - d.mod.falta;
    S.j[vit].pontos[g] += 1;
    log("Invasão na linha central — falta. Ponto para "+S.j[vit].nome+".", vit);
  } else if(Math.random() < pp){
    let pts = 1 + d.mod.bonus + (d.atq.mods.bonusPonto||0);
    S.j[d.ia].pontos[g] += pts;
    log(d.atq.nm+" marcou "+pts+" para "+S.j[d.ia].nome+" ("+pct(pp)+").", d.ia);
  } else {
    S.j[d.idf].pontos[g] += 1;
    log(d.def.nm+" defendeu — ponto para "+S.j[d.idf].nome+".", d.idf);
  }

  if(!d.atq.expulsa && !d.def.expulsa){
    if(Math.random() < pld){
      const q = Math.max(0, 1 - d.mod.evita);
      if(q>0) ferir(d.def, 1, "demanda acima da capacidade no duelo", pld);
      else log("Atendimento imediato evitou a lesão de "+d.def.nm+".", d.idf);
    }
    if(Math.random() < pla) ferir(d.atq, 1, "carga mal administrada no dia de jogo", pla);
  }

  d.feito = true;
  S.di++;
  S.sel = null;
  if(S.di >= S.duelos.length) fecharJogo(); else render();
}

function fecharJogo(){
  const g = S.jogo, r = rodadaAtual();
  const p0 = S.j[0].pontos[g], p1 = S.j[1].pontos[g];
  let v = null;
  if(p0 > p1) v = 0; else if(p1 > p0) v = 1;
  if(v !== null){
    S.j[v].vitorias++;
    S.j[v].perdeu = false;
    S.j[1-v].perdeu = true;
    S.primeiro = 1 - v;   /* freio de acesso: quem perdeu escolhe primeiro no mercado */
    log(S.j[v].nome+" venceu "+r.r+" por "+Math.max(p0,p1)+" a "+Math.min(p0,p1)+".", v);
  } else {
    log(r.r+" empatado em "+p0+".", null);
  }
  for(const j of S.j){
    const emQuadra = naQuadra(j);
    for(const a of j.elenco){
      const jogou = emQuadra.includes(a.id);
      const presc = cargaRodada(a) + (jogou ? CARGA_JOGO : 0);
      const real  = presc * fatorHoje(a);
      a.pse.push({r:r.r, presc, fat:fatorHoje(a), real, medida:false});
      a.hist.push(real);
      a.tmp.protecao = 0;
      a.tmp.attrPenal = 0;
      a.expulsa = false;
      a.serie.push({r:r.r, aguda:aguda(a), cronica:cronica(a), razao:razao(a)});
    }
  }
  S.jogo++;
  S.rodada++;
  S.fase = "resultado";
  render();
}

/* ══════════════════════ TELA · RESULTADO DO JOGO ══════════════════════ */

  const r = el("div","row");
  const fim = S.rodada >= SEQ.length;
  const b = el("button","pri", fim ? "Ver o relatório da partida" : "Seguir para "+SEQ[S.rodada].r);
  b.onclick = ()=>{
    if(fim){ S.fase="relatorio"; render(); }
    else { iniciaRodada(); render(); }
  };
  r.appendChild(b);
  w.appendChild(r);
  app.appendChild(w);
}

/* ══════════════════════ CURVA DE CARGA ══════════════════════ */
function curvaSVG(a){
  const W=300,H=96,pad=22;
  const s = a.serie;
  if(!s.length) return el("div");
  const maxV = Math.max(4, ...s.map(x=>Math.max(x.aguda,x.cronica)));
  const X = (i)=>pad + (s.length<2?0:i*(W-pad-10)/(s.length-1));
  const Y = (v)=>H-18 - (v/maxV)*(H-34);
  const mk=(t,at)=>{const n=document.createElementNS(NS,t); for(const k in at) n.setAttribute(k,at[k]); return n;};
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox","0 0 "+W+" "+H); svg.setAttribute("width","100%");
  svg.setAttribute("role","img");
  svg.setAttribute("aria-label","curva de carga de "+a.nm);
  svg.appendChild(mk("line",{x1:pad,y1:H-18,x2:W-10,y2:H-18,stroke:"#24323F","stroke-width":1}));
  const linha=(key,cor,tracejado)=>{
    const d = s.map((x,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(x[key]).toFixed(1)).join(" ");
    const p = mk("path",{d, fill:"none", stroke:cor, "stroke-width":2});
    if(tracejado) p.setAttribute("stroke-dasharray","4 3");
    svg.appendChild(p);
  };
  linha("cronica","#4A9BE0",true);
  linha("aguda","#F0803C",false);
  for(const ev of a.eventos){
    const i = s.findIndex(x=>x.r===ev.r);
    if(i<0) continue;
    svg.appendChild(mk("circle",{cx:X(i),cy:Y(s[i].aguda),r:4.5,fill:"#E05252",stroke:"#0A1018","stroke-width":1.5}));
  }
  s.forEach((x,i)=>{
    const t=mk("text",{x:X(i),y:H-6,fill:"#5C7083","font-size":8,"text-anchor":"middle","font-family":"JetBrains Mono, monospace"});
    t.textContent = x.r; svg.appendChild(t);
  });
  const t0=mk("text",{x:2,y:Y(maxV)+3,fill:"#5C7083","font-size":8,"font-family":"JetBrains Mono, monospace"});
  t0.textContent = String(Math.round(maxV)); svg.appendChild(t0);
  const t1=mk("text",{x:2,y:H-15,fill:"#5C7083","font-size":8,"font-family":"JetBrains Mono, monospace"});
  t1.textContent="0"; svg.appendChild(t1);
  return svg;
}
function leitura(a){
  const s=a.serie; if(!s.length) return "não entrou em campo e não recebeu programa";
  const rs = s.map(x=>x.razao);
  const maxR = Math.max(...rs), minR = Math.min(...rs);
  const partes=[];
  if(maxR>1.45) partes.push("razão chegou a "+maxR.toFixed(2)+" — sobrecarga");
  if(minR<.8) partes.push("razão caiu a "+minR.toFixed(2)+" — chegou destreinada");
  if(!partes.length) partes.push("razão entre "+minR.toFixed(2)+" e "+maxR.toFixed(2)+" — dose bem administrada");
  if(a.eventos.length) partes.push(a.eventos.length+" lesão(ões)");
  return partes.join(" · ");
}
function vencedorPartida(){
  const a=S.j[0], b=S.j[1];
  if(a.vitorias!==b.vitorias) return {v:a.vitorias>b.vitorias?0:1, crit:"jogos ganhos"};
  const sa=a.pontos[0]+a.pontos[1], sb=b.pontos[0]+b.pontos[1];
  if(sa!==sb) return {v:sa>sb?0:1, crit:"saldo de pontos ("+sa+" a "+sb+")"};
  const la=a.elenco.reduce((s,x)=>s+x.lesao,0), lb=b.elenco.reduce((s,x)=>s+x.lesao,0);
  if(la!==lb) return {v:la<lb?0:1, crit:"menos pontos de lesão ("+la+" a "+lb+")"};
  return {v:null, crit:"empate em tudo"};
}

/* ══════════════════════ CÓDIGO DE RESULTADO ══════════════════════
   Uma linha de texto que carrega o essencial da partida para o painel da turma.
   Legível de propósito: se o grupo não conseguir copiar, dá para ditar.
   Não carrega as curvas — carrega o que o debrief usa, que são os dois erros opostos. */
const SEP = "|";
function limpo(s){ return String(s).replace(/[|\n\r]/g," ").trim().slice(0,18) || "Grupo"; }
function diagnostico(j){
  let exc = 0, fal = 0, pior = -1, maior = 0;
  j.elenco.forEach((a,i)=>{
    if(!a.serie.length) return;
    const rs = a.serie.map(x=>x.razao);
    const mx = Math.max(...rs), mn = Math.min(...rs);
    if(mx > 1.45) exc++;
    if(mn < .8) fal++;
    if(mx > maior){ maior = mx; pior = i; }
  });
  return {exc, fal, pior, maior,
          les: j.elenco.reduce((s,a)=>s+a.lesao,0),
          fora: j.elenco.filter(a=>!disponivel(a)).length};
}
function codigoResultado(){
  const [A,B] = S.j, dA = diagnostico(A), dB = diagnostico(B);
  return ["DOSE2", limpo(A.nome), limpo(B.nome),
    A.pontos[0]+"-"+B.pontos[0], A.pontos[1]+"-"+B.pontos[1],
    dA.les+"-"+dB.les, dA.exc+"-"+dA.fal, dB.exc+"-"+dB.fal,
    dA.pior+"-"+Math.round(dA.maior*100), dB.pior+"-"+Math.round(dB.maior*100),
    dA.fora+"-"+dB.fora
  ].join(SEP);
}
function lerCodigo(txt){
  const p = String(txt).trim().split(SEP);
  const v2 = p[0]==="DOSE2" && p.length===11;
  const v1 = p[0]==="DOSE1" && p.length===10;
  if(!v1 && !v2) return null;
  const par = (s)=>{ const [a,b] = String(s).split("-").map(Number);
    return (isFinite(a) && isFinite(b)) ? [a,b] : null; };
  const j1 = par(p[3]), j2 = par(p[4]), les = par(p[5]);
  const eA = par(p[6]), eB = par(p[7]), pA = par(p[8]), pB = par(p[9]);
  const fora = v2 ? par(p[10]) : [0,0];
  if(!j1 || !j2 || !les || !eA || !eB || !pA || !pB || !fora) return null;
  const v = (a,b)=>a>b ? 1 : a<b ? 2 : 0;
  const vit = [0,0];
  for(const g of [j1,j2]){ const q = v(g[0],g[1]); if(q) vit[q-1]++; }
  const nome = (i)=>(i>=0 && ATLETAS[i]) ? ATLETAS[i].nm : "—";
  return {nomes:[p[1],p[2]], j1, j2, vit, les, fora,
          erros:[{exc:eA[0], fal:eA[1]}, {exc:eB[0], fal:eB[1]}],
          pior:[{nm:nome(pA[0]), r:pA[1]/100}, {nm:nome(pB[0]), r:pB[1]/100}],
          bruto:String(txt).trim()};
}
/* Uma linha por GRUPO, não por partida — é a unidade em que a decisão foi tomada. */
function linhasDoPainel(partidas){
  const L = [];
  for(const p of partidas) for(let i=0;i<2;i++)
    L.push({nome:p.nomes[i], exc:p.erros[i].exc, fal:p.erros[i].fal,
            les:p.les[i], fora:p.fora[i], vit:p.vit[i],
            pontos:p.j1[i]+p.j2[i], pior:p.pior[i],
            erros:p.erros[i].exc + p.erros[i].fal});
  /* ordenado por erro de carga: a tabela vira um gradiente, e o gradiente é a aula */
  L.sort((a,b)=>a.erros-b.erros || a.les-b.les);
  return L;
}

/* ── RELATÓRIO · O QUE VOCÊ PEDIU × O QUE ELAS PAGARAM ───────────────────────
   Aqui a conta fecha. Durante a partida o grupo só via a carga prescrita e o que
   tivesse medido. No fim, tudo é revelado — inclusive o fator das atletas que nunca
   foram medidas, que é onde costuma estar a surpresa. */
function blocoPSE(){
  const w = el("div","card stack");
  w.appendChild(el("h3","","Carga prescrita × carga paga"));
  w.appendChild(el("p","dim","A razão aguda:crônica de cada atleta foi calculada sobre a coluna "
    + "da direita. Quem nunca foi medida teve a projeção calculada como se pagasse 1,00× — "
    + "e a diferença entre as duas colunas é o tamanho do erro que isso produziu."));
  for(const j of S.j){
    const medidas = j.elenco.length ? j.elenco[0].pse.filter(x=>x.medida).length : 0;
    const sec = el("div","stack");
    sec.appendChild(el("div","lbl", j.nome + " · mediu a PSE em " + medidas + " de "
      + (j.elenco.length ? j.elenco[0].pse.length : 0) + " rodadas"));
    const tb = el("table","tab");
    const hd = el("tr");
    for(const h of ["Atleta","Prescrito","Pago","Fator médio","Nunca medida"]) hd.appendChild(el("th","",h));
    tb.appendChild(hd);
    const linhas = j.elenco.map(a=>{
      const sp = a.pse.reduce((t,x)=>t+x.presc,0);
      const sr = a.pse.reduce((t,x)=>t+x.real,0);
      return {a, sp, sr, f: sp>0 ? sr/sp : 1, cega: a.pseVisto == null};
    }).sort((x,y)=>y.f-x.f);
    for(const L of linhas){
      const tr = el("tr");
      tr.appendChild(el("td","",L.a.nm));
      tr.appendChild(el("td","num", nf(Math.round(L.sp*10)/10)));
      const td = el("td","num psev"); td.textContent = nf(Math.round(L.sr*10)/10);
      tr.appendChild(td);
      const tf = el("td","num"); tf.textContent = L.f.toFixed(2)+"×";
      if(L.f >= 1.12) tf.style.color = "var(--vermelho)";
      else if(L.f <= 1.02) tf.style.color = "var(--verde)";
      tr.appendChild(tf);
      const tc = el("td", "faint", L.cega ? "nunca medida" : "—");
      if(L.cega) tc.style.color = "var(--ambar)";
      tr.appendChild(tc);
      tb.appendChild(tr);
    }
    sec.appendChild(tb);
    const cegas = linhas.filter(L=>L.cega && L.f >= 1.10).map(L=>L.a.nm);
    if(cegas.length){
      const al = el("div","aviso");
      al.innerHTML = "<b>" + cegas.join(", ") + "</b> pagou mais de 1,10× o treino "
        + "prescrito e nunca foi medida. A projeção que apareceu na tela durante a "
        + "partida inteira estava otimista para ela.";
      sec.appendChild(al);
    } else if(medidas === 0){
      sec.appendChild(el("div","aviso","Este grupo nunca colheu a PSE. "
        + "Jogou a partida inteira com a carga prescrita, que é a planilha do treinador — "
        + "não a resposta das atletas."));
    }
    w.appendChild(sec);
  }
  w.appendChild(el("p","faint","Pergunta para o debrief: medir custava 1 de energia por rodada, "
    + "de seis. Quem mediu gastou menos treinando. Compensou? E para quem NÃO compensaria?"));
  return w;
}
